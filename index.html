<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My AR Fox Experience</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"
    />
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

    <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>

    <link rel="stylesheet" type="text/css" href="./shared/app.css" />
    <script src="./shared/utils.js"></script>
  </head>
  <body>
    <div id="enter-ar-info" class="mdc-card demo-card">
      <h2>My Augmented Reality Fox</h2>
      <p>
        Tap the button below and then tap on any surface to place a 3D fox in
        your room!
      </p>

      <a id="enter-ar" class="mdc-button mdc-button--raised mdc-button--accent">
        Start AR Fox
      </a>
    </div>

    <div id="unsupported-info" class="mdc-card demo-card">
      <h2>Unsupported Browser</h2>
      <p>Your browser does not support AR features with WebXR.</p>
    </div>
    <script src="app.js"></script>
    <div id="stabilization"></div>
  </body>
</html>
